name: Validate skills

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate marketplace manifest
        run: npx --yes @anthropic-ai/claude-code plugin validate --strict .

      # Pinned so a new skills-ref release can't break the build unexpectedly.
      - name: Validate every skill
        run: |
          for skill in skills/*/; do
            npx --yes skills-ref@0.1.5 validate "$skill"
          done
